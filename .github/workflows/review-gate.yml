name: review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-gate:
    name: review-gate
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        if: hashFiles('crates/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Generate verification report
        if: hashFiles('crates/Cargo.toml') != ''
        shell: bash
        run: |
          set -o pipefail
          cargo run --manifest-path crates/sim-cli/Cargo.toml -- verify --suite all | tee report.json
      - name: Review evidence gate
        env:
          GH_TOKEN: ${{ github.token }}
          HELIX_ATTEST_SECRET: ${{ secrets.HELIX_ATTEST_SECRET }}
          VERIFY_REPORT: report.json
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/review_gate.py "${{ github.event.pull_request.number || github.event.issue.number }}"
